services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: durga
      POSTGRES_PASSWORD: durga_secret
      POSTGRES_DB: durga_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U durga -d durga_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://durga:durga_secret@db:5432/durga_db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
