name: durga
description: "DURGA - Women Safety Application"

publish_to: 'none'

version: 1.0.0+1

environment:
  # FIX: was ^3.12.2, but installed Flutter SDK on this machine ships Dart
  # 3.8.1 - loosened lower bound so `flutter pub get` resolves. Raise back
  # once the toolchain is on Dart 3.12+.
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.5

  # Local Storage
  shared_preferences: ^2.3.2

  # Location
  geolocator: ^11.1.0
  geocoding: ^3.0.0

  # Permissions
  permission_handler: ^11.3.1

  # Camera & Gallery
  image_picker: ^1.1.2

  # Open Maps / Phone / SMS
  url_launcher: ^6.3.0

  # Fonts
  google_fonts: ^6.2.1

  # SVG Icons
  flutter_svg: ^2.0.10+1

  # Google Maps
  google_maps_flutter: ^2.9.0

  # Simple Animations
  flutter_animate: ^4.5.0

  # Icons
  font_awesome_flutter: ^10.7.0

  # UUID Generator
  uuid: ^4.5.1

  # Date Formatting
  intl: ^0.19.0

  # HTTP Client (approved)
  dio: ^5.7.0

  # Secure Token Storage (approved)
  flutter_secure_storage: ^9.2.4

  # Supabase (cloud database)
  supabase_flutter: ^2.8.0

  # Device contacts picker
  flutter_contacts: ^1.1.9+2

  # Audio recording (silent record feature)
  record: ^5.2.1
  camera: ^0.11.2+1
  flutter_dotenv: ^6.0.1
  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.5
  google_generative_ai: ^0.4.7
  flutter_local_notifications: ^19.5.0
  flutter_foreground_task: ^9.2.2
  open_wake_word:
    path: d:\Downloads2\cap\open_wake_word

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

dependency_overrides:
  record_platform_interface: 1.2.0

flutter:

  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/icons/
    - assets/wake_word/
    - assets/legal/

  # Uncomment when we add custom fonts
  # fonts:
  #   - family: Poppins
  #     fonts:
  #       - asset: assets/fonts/Poppins-Regular.ttf
  #       - asset: assets/fonts/Poppins-Bold.ttf
  #         weight: 700